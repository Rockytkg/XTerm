# XTerm 多平台构建与发布工作流
#
# 版本号策略(由 version job 统一计算,经 `tauri build --config` 注入,不改仓库文件):
#   - 推送 tag v1.2.3             -> 版本 1.2.3,打全平台包并创建 GitHub Release
#   - 推送 main / 手动触发        -> 版本 <上一tag>-dev.<commit数>+<短sha> 快照,只上传 workflow artifacts,不发布
#
# 发布策略(逐平台即时发布,不等全部编译完):
#   - release-init 在 version 确定后立即创建 Release(含发行说明)
#   - 各平台 job 编译完成后马上 `gh release upload` 上传自己的安装包,先完成的先上
#   - 各 job 上传时若 Release 尚未创建则先创建空壳(幂等),避免竞态
#
# 平台矩阵(全部原生编译,无交叉):
#   - linux   x64  (ubuntu-22.04)       deb / rpm / appimage
#   - linux   arm64(ubuntu-22.04-arm)   deb(GitHub ARM runner 仅公共仓库可用)
#   - windows x64  (windows-latest)     nsis / msi
#   - windows arm64(windows-11-arm)     nsis / msi
#   - macos   arm64(macos-latest)       app / dmg
#   - macos   x64  (macos-latest 交叉)   app / dmg
#   - arch    x86_64(ubuntu-latest + archlinux:base-devel 容器) .pkg.tar.zst
#
# 缓存:Rust 依赖与编译产物用 Swatinem/rust-cache 缓存,前端依赖用 pnpm 缓存,
#   避免每次构建都重新下载依赖。构建失败也保存缓存,加速重试。
#
# 命名说明:Linux 上 "xterm" 是 X11 终端的固定名称,Arch 包改用 xterm-workspace 避免覆盖
#   /usr/bin/xterm;deb/rpm/AppImage 二进制名保持 productName "XTerm"(大小写不同不冲突)。

name: Build & Release

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 统一版本号计算
  # ---------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      is_release: ${{ steps.compute.outputs.is_release }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute version from git ref
        id: compute
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            IS_RELEASE=true
            TAG="${GITHUB_REF_NAME}"
          else
            BASE=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)
            if [[ -z "$BASE" ]]; then
              # 仓库尚无 tag 时,退回 tauri.conf.json 中声明的版本
              BASE=$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -n1)
            fi
            N=$(git rev-list --count HEAD)
            SHA=$(git rev-parse --short HEAD)
            VERSION="${BASE}-dev.${N}+${SHA}"
            IS_RELEASE=false
            TAG=""
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VERSION} (release=${IS_RELEASE})"

  # ---------------------------------------------------------------------------
  # 发布初始化:version 确定后立即创建 Release(带发行说明),不等各平台编译完
  # ---------------------------------------------------------------------------
  release-init:
    needs: [version]
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes from commits
        run: |
          set -euo pipefail
          # 发行说明 = 从上一 tag(或首次发布的所有 commit)到当前 tag 的 commit,按类型分组
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [[ -n "$PREV" ]]; then RANGE="${PREV}..HEAD"; else RANGE="HEAD"; fi
          NOTES="release-notes.md"

          echo "# XTerm v${VERSION}" > "$NOTES"
          echo "" >> "$NOTES"
          echo "> 基于合并 commit 自动生成的发行说明(${RANGE})。" >> "$NOTES"

          FEAT=$(git log "$RANGE" --pretty=format:"%s" | grep -E '^feat' \
            | sed -E 's/^feat(\([^)]*\))?: //' | sed 's/^/- /' || true)
          if [[ -n "$FEAT" ]]; then printf '\n## ✨ 新功能\n%s\n' "$FEAT" >> "$NOTES"; fi

          FIX=$(git log "$RANGE" --pretty=format:"%s" | grep -E '^fix' \
            | sed -E 's/^fix(\([^)]*\))?: //' | sed 's/^/- /' || true)
          if [[ -n "$FIX" ]]; then printf '\n## 🐛 修复\n%s\n' "$FIX" >> "$NOTES"; fi

          OTHER=$(git log "$RANGE" --pretty=format:"%s" \
            | grep -vE '^(feat|fix)(\([^)]*\))?: ' | grep -vE '^(Merge|merge)' \
            | grep -v '^$' \
            | sed -E 's/^(chore|refactor|docs|build|style|perf|test|ci)(\([^)]*\))?: //' \
            | sed 's/^/- /' || true)
          if [[ -n "$OTHER" ]]; then printf '\n## 🔧 其他变更\n%s\n' "$OTHER" >> "$NOTES"; fi

          echo "---- generated release notes ----"
          cat "$NOTES"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 幂等:若某平台已抢先创建了空壳 Release,这里只补齐发行说明
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --notes-file release-notes.md
          fi

  # ---------------------------------------------------------------------------
  # Linux x86_64:deb / rpm / AppImage
  # ---------------------------------------------------------------------------
  linux-x64:
    needs: [version]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Tauri 的 Cargo 工作区在 src-tauri,必须指定才能正确缓存依赖
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version across manifests
        run: |
          # 用 node 而非 sed:macOS/Windows runner 是 BSD sed,不支持 GNU 的 0,/pattern/ 语法
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            let cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
            cargo = cargo.replace(/^version = "[^"]*"/m, `version = "${v}"`);
            fs.writeFileSync("src-tauri/Cargo.toml", cargo);
            const pkgPath = "package.json";
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            pkg.version = v;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
          '

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf zstd \
            xdg-utils build-essential libssl-dev libudev-dev

      - name: Build deb / rpm / AppImage
        run: |
          # 用 pnpm exec 直接调 tauri CLI:package.json 里 "tauri" 脚本是 "tauri dev",
          # 若写 `pnpm tauri build` 会被解析成 `tauri dev build`,跑到 dev profile 且参数报错
          pnpm exec tauri build --bundles deb,rpm,appimage \
            --config "{\"version\":\"${VERSION}\"}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            # 裸二进制,供 arch job 组装 pacman 包
            src-tauri/target/release/xterm

      - name: Publish to release
        if: needs.version.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --notes "XTerm $TAG"
          fi
          gh release upload "$TAG" \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/rpm/*.rpm \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            --repo "$GITHUB_REPOSITORY" --clobber

  # ---------------------------------------------------------------------------
  # Linux arm64:deb(GitHub 原生 ARM runner;arm runner 仅公共仓库免费)
  # ---------------------------------------------------------------------------
  linux-arm64:
    needs: [version]
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version across manifests
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            let cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
            cargo = cargo.replace(/^version = "[^"]*"/m, `version = "${v}"`);
            fs.writeFileSync("src-tauri/Cargo.toml", cargo);
            const pkgPath = "package.json";
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            pkg.version = v;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
          '

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf zstd \
            xdg-utils build-essential libssl-dev libudev-dev

      - name: Build arm64 deb
        run: |
          pnpm exec tauri build --target aarch64-unknown-linux-gnu \
            --bundles deb \
            --config "{\"version\":\"${VERSION}\"}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64
          if-no-files-found: error
          path: src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb

      - name: Publish to release
        if: needs.version.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --notes "XTerm $TAG"
          fi
          gh release upload "$TAG" \
            src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb \
            --repo "$GITHUB_REPOSITORY" --clobber

  # ---------------------------------------------------------------------------
  # Windows x86_64:NSIS / MSI
  # ---------------------------------------------------------------------------
  windows-x64:
    needs: [version]
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version across manifests
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            let cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
            cargo = cargo.replace(/^version = "[^"]*"/m, `version = "${v}"`);
            fs.writeFileSync("src-tauri/Cargo.toml", cargo);
            const pkgPath = "package.json";
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            pkg.version = v;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
          '

      - name: Build NSIS / MSI
        run: |
          pnpm exec tauri build --bundles nsis,msi \
            --config "{\"version\":\"${VERSION}\"}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Publish to release
        if: needs.version.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --notes "XTerm $TAG"
          fi
          gh release upload "$TAG" \
            src-tauri/target/release/bundle/nsis/*.exe \
            src-tauri/target/release/bundle/msi/*.msi \
            --repo "$GITHUB_REPOSITORY" --clobber

  # ---------------------------------------------------------------------------
  # Windows arm64:NSIS / MSI(GitHub 原生 ARM runner)
  # ---------------------------------------------------------------------------
  windows-arm64:
    needs: [version]
    runs-on: windows-11-arm
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version across manifests
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            let cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
            cargo = cargo.replace(/^version = "[^"]*"/m, `version = "${v}"`);
            fs.writeFileSync("src-tauri/Cargo.toml", cargo);
            const pkgPath = "package.json";
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            pkg.version = v;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
          '

      - name: Build arm64 NSIS / MSI
        run: |
          pnpm exec tauri build --target aarch64-pc-windows-msvc \
            --bundles nsis,msi \
            --config "{\"version\":\"${VERSION}\"}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-arm64
          if-no-files-found: error
          path: |
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi

      - name: Publish to release
        if: needs.version.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --notes "XTerm $TAG"
          fi
          gh release upload "$TAG" \
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe \
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi \
            --repo "$GITHUB_REPOSITORY" --clobber

  # ---------------------------------------------------------------------------
  # macOS arm64:app / dmg(原生)
  # ---------------------------------------------------------------------------
  macos-arm64:
    needs: [version]
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version across manifests
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            let cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
            cargo = cargo.replace(/^version = "[^"]*"/m, `version = "${v}"`);
            fs.writeFileSync("src-tauri/Cargo.toml", cargo);
            const pkgPath = "package.json";
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            pkg.version = v;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
          '

      - name: Build aarch64 app / dmg
        run: |
          pnpm exec tauri build --target aarch64-apple-darwin \
            --bundles app,dmg \
            --config "{\"version\":\"${VERSION}\"}"

      - name: Archive .app bundle
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          zip -rqy "${GITHUB_WORKSPACE}/XTerm-${VERSION}-darwin-arm64.zip" XTerm.app

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          if-no-files-found: error
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            XTerm-*.zip

      - name: Publish to release
        if: needs.version.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --notes "XTerm $TAG"
          fi
          gh release upload "$TAG" \
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg \
            XTerm-*.zip \
            --repo "$GITHUB_REPOSITORY" --clobber

  # ---------------------------------------------------------------------------
  # macOS x86_64:app / dmg(在 arm64 runner 上交叉,避免依赖 Intel runner 生命周期)
  # ---------------------------------------------------------------------------
  macos-x64:
    needs: [version]
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version across manifests
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            let cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
            cargo = cargo.replace(/^version = "[^"]*"/m, `version = "${v}"`);
            fs.writeFileSync("src-tauri/Cargo.toml", cargo);
            const pkgPath = "package.json";
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            pkg.version = v;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
          '

      - name: Build x86_64 app / dmg
        run: |
          pnpm exec tauri build --target x86_64-apple-darwin \
            --bundles app,dmg \
            --config "{\"version\":\"${VERSION}\"}"

      - name: Archive .app bundle
        run: |
          cd src-tauri/target/x86_64-apple-darwin/release/bundle/macos
          zip -rqy "${GITHUB_WORKSPACE}/XTerm-${VERSION}-darwin-x64.zip" XTerm.app

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-x64
          if-no-files-found: error
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            XTerm-*.zip

      - name: Publish to release
        if: needs.version.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --notes "XTerm $TAG"
          fi
          gh release upload "$TAG" \
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg \
            XTerm-*.zip \
            --repo "$GITHUB_REPOSITORY" --clobber

  # ---------------------------------------------------------------------------
  # Arch Linux x86_64 pacman 包(原生二进制 PKGBUILD)
  # 在 archlinux:base-devel 容器内以非 root 用户运行 makepkg
  # ---------------------------------------------------------------------------
  arch:
    needs: [version, linux-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Download linux x64 release binary
        uses: actions/download-artifact@v8
        with:
          name: linux-x64
          path: linux-x64-artifacts

      - name: Build Arch package
        run: |
          set -euo pipefail
          BIN=$(find linux-x64-artifacts -type f -name xterm | head -n1)
          [[ -n "$BIN" ]] || { echo "xterm binary not found" >&2; exit 1; }

          # pacman 的 pkgver 不允许连字符,将快照版本中的 '-' 转为 '_'
          PKGVER=$(printf '%s' "${VERSION}" | tr '-' '_')

          mkdir -p arch-build
          cp "$BIN" arch-build/xterm-workspace
          cp src-tauri/arch/xterm-workspace.desktop arch-build/
          cp src-tauri/icons/128x128.png arch-build/icon-128.png

          sed "s/^pkgver=__PKGVER__/pkgver=${PKGVER}/" src-tauri/arch/PKGBUILD > arch-build/PKGBUILD
          # 用真实校验和替换 SKIP 占位,保证包完整性
          SHA1=$(sha256sum arch-build/xterm-workspace | awk '{print $1}')
          SHA2=$(sha256sum arch-build/xterm-workspace.desktop | awk '{print $1}')
          SHA3=$(sha256sum arch-build/icon-128.png | awk '{print $1}')
          sed -i "s/__SHA256_BIN__/$SHA1/; s/__SHA256_DESKTOP__/$SHA2/; s/__SHA256_ICON__/$SHA3/" arch-build/PKGBUILD

          docker run --rm \
            -v "$PWD/arch-build:/build" \
            archlinux:base-devel \
            bash -c '
              set -e
              pacman -Syu --noconfirm --needed >/tmp/pacman.log 2>&1 \
                || { tail -n 30 /tmp/pacman.log; exit 1; }
              useradd -m builder 2>/dev/null || true
              chown -R builder:builder /build
              cd /build
              # -d/--nodeps:容器未装 GUI 运行时依赖,我们打包的是已编译二进制,
              # 运行时依赖由目标系统 pacman 安装时解析,容器内无需安装
              su builder -c "makepkg -f -d --noconfirm"
              # 移除 makepkg 生成的 -debug 符号包,只保留正式安装包
              rm -f /build/*-debug-*.pkg.tar.zst
              # 主包重命名为 XTerm 前缀,与 Release 中其他平台资产命名一致
              # (Arch pkgname 规范要求小写,故包内名保持 xterm-workspace,仅文件重命名)
              MAIN_PKG=$(ls /build/xterm-workspace-*.pkg.tar.zst)
              mv "$MAIN_PKG" "/build/XTerm-$(basename "$MAIN_PKG" | sed 's/^xterm-workspace-//')"
            '

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: arch
          if-no-files-found: error
          path: arch-build/*.pkg.tar.zst

      - name: Publish to release
        if: needs.version.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --notes "XTerm $TAG"
          fi
          gh release upload "$TAG" \
            arch-build/*.pkg.tar.zst \
            --repo "$GITHUB_REPOSITORY" --clobber
