name: 功能建议
description: 提出新的功能需求或改进建议
title: "[Feature]: "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述你希望解决的问题与期望的行为。
  - type: checkboxes
    id: prerequisites
    attributes:
      label: 请先确认
      options:
        - label: 我已搜索现有 Issues，未发现相同需求
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前缺少什么能力，或存在什么不便？
      placeholder: 例如：希望终端支持横向分屏
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 方案建议
      description: 你期望的实现方式或交互行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 其他考虑过或见过的做法
