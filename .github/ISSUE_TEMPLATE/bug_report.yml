name: 问题反馈（Bug）
description: 报告使用 XTerm 时遇到的问题
title: "[Bug]: "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写以下信息，便于快速定位与复现问题。
  - type: checkboxes
    id: prerequisites
    attributes:
      label: 请先确认
      options:
        - label: 我已阅读 README 与相关文档
          required: true
        - label: 我已搜索现有 Issues，未发现相同问题
          required: true
  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 设置 → 关于 中显示的版本号
      placeholder: 例如 0.1.1
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      description: 操作系统名称与版本
      placeholder: 例如 Windows 11 Pro 23H2
    validations:
      required: true
  - type: input
    id: protocol
    attributes:
      label: 相关功能
      description: 问题涉及的模块（SSH / Telnet / 串口 / SFTP / 文件服务器 / 脚本引擎 / 其他）
      placeholder: 例如 SSH 连接、SFTP 上传
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如何触发该问题？
      placeholder: |
        1. 打开设置，添加一个 SSH 连接
        2. 在会话中执行 xxx
        3. 出现 xxx
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？可附截图或错误信息
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 设置 → 通用 → 日志查看器 中复制的相关日志（注意脱敏，勿暴露密码、私钥或主机信息）
      render: shell
